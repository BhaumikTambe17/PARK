<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SmartPark</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>SmartPark<small>Smart Parking System</small></span></a><div class="navlinks"></div></nav><main class="page"><div class="container split"><div class="side-panel"><h1>Create Account</h1><p>Fill in your details to create your account.</p><a href="index.html" style="color:#20c83f">← Back to Home</a></div><div class="form-panel"><h2>Register</h2><form id="registerForm"><div class="form-group"><label>Full Name</label><input id="name" class="form-control" placeholder="Enter your full name" required></div><div class="form-group"><label>Email</label><input id="email" class="form-control" type="email" placeholder="Enter your email" required></div><div class="form-group"><label>Password</label><input id="password" class="form-control" type="password" minlength="6" placeholder="Enter your password" required></div><div class="form-group"><label>Confirm Password</label><input id="confirm" class="form-control" type="password" placeholder="Confirm your password" required></div><div id="msg" class="error"></div><button class="btn btn-green">Register</button></form><p class="small">Already have an account? <a href="login.html">Login</a></p></div></div></main><script src="app.js"></script></body></html>
